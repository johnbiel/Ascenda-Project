<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Painel ADM | Evolua</title>
  <link rel="stylesheet" href="adm.css">
</head>
<body>
  <main class="container">
    <div class="brand">EVO<span>LUA</span></div>

    <!-- LOGIN -->
    <section id="loginArea" class="panel">
      <h1>Painel Administrativo</h1>
      <p class="muted">
        Entre com sua conta autorizada para gerenciar os produtos.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required placeholder="seu@email.com">
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>

        <button class="button primary" id="loginButton" type="submit">
          Entrar no painel
        </button>

        <p id="loginStatus" class="status" role="status"></p>
      </form>
    </section>

    <!-- ÁREA ADMIN -->
    <section id="adminArea" class="hidden">
      <div class="panel">
        <div class="topbar">
          <div>
            <h1>Dashboard</h1>
            <p class="muted" style="margin: 8px 0 0">
              Logado como <strong id="adminEmail"></strong>
            </p>
          </div>
          <button class="button secondary" id="logoutButton" type="button">
            Sair
          </button>
        </div>
        <p class="muted">
          Cadastre, edite ou exclua e-books. Os dados são salvos no Firestore.
        </p>
      </div>

      <!-- Formulário -->
      <div class="panel">
        <h2 id="formTitle">Cadastrar novo e-book</h2>

        <form id="productForm">
          <input type="hidden" id="productId">

          <div class="field">
            <label for="productTitle">Nome do e-book</label>
            <input id="productTitle" type="text" maxlength="120" required>
          </div>

          <div class="field">
            <label for="productDescription">Descrição</label>
            <textarea id="productDescription" maxlength="1000" required></textarea>
          </div>

          <div class="field">
            <label for="productPrice">Preço (R$)</label>
            <input id="productPrice" type="number" min="0" step="0.01" placeholder="29.90" required>
          </div>

          <div class="field">
            <label for="productImage">URL da imagem da capa</label>
            <input id="productImage" type="url" placeholder="https://exemplo.com/capa.jpg" required>
          </div>

          <div class="field">
            <label for="productLink">Link de compra (Kiwify)</label>
            <input id="productLink" type="url" placeholder="https://pay.kiwify.com.br/..." required>
          </div>

          <div class="form-actions">
            <button class="button primary" id="saveProductButton" type="submit">
              Cadastrar e-book
            </button>
            <button class="button secondary hidden" id="cancelEditButton" type="button">
              Cancelar edição
            </button>
          </div>

          <p id="productStatus" class="status" role="status"></p>
        </form>
      </div>

      <!-- Lista -->
      <div class="panel">
        <h2>E-books cadastrados</h2>
        <div id="productList" class="products-list">
          <p class="muted">Carregando produtos...</p>
        </div>
        <p id="listStatus" class="status" role="status"></p>
      </div>
    </section>
  </main>

  <!-- Firebase + Scripts (caminhos corrigidos) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="adm.js"></script>
</body>
</html>
