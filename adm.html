
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Painel ADM | Evolua</title>
  <link rel="stylesheet" href="adm.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
      padding: 35px 0;
    }

    .brand {
      margin-bottom: 30px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .brand span {
      color: #b6ff5c;
    }

    .panel {
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .muted {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    input, textarea {
      width: 100%;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 13px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #b6ff5c;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .button {
      border: 0;
      border-radius: 8px;
      padding: 13px 18px;
      font-weight: bold;
    }

    .primary {
      background: #b6ff5c;
      color: #080808;
    }

    .secondary {
      background: #242424;
      color: white;
      border: 1px solid #3a3a3a;
    }

    .danger {
      background: #351616;
      color: #ffaaaa;
      border: 1px solid #642626;
    }

    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #b6ff5c;
    }

    .error {
      color: #ff8585;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .products-list {
      display: grid;
      gap: 12px;
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      border: 1px solid #2b2b2b;
      border-radius: 10px;
      padding: 17px;
    }

    .product h3 {
      margin-bottom: 7px;
    }

    .product p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .panel {
        padding: 20px;
      }

      .product {
        flex-direction: column;
      }

      .product-actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">EVO<span>LUA</span></div>

    <section id="loginArea" class="panel">
      <h1>Painel administrativo</h1>
      <p class="muted">
        Entre com sua conta autorizada para administrar os produtos da loja.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="button primary" id="loginButton" type="submit">
          Entrar no painel
        </button>

        <p id="loginStatus" class="status" role="status"></p>
      </form>
    </section>

    <section id="adminArea" class="hidden">
      <div class="panel">
        <div class="topbar">
          <div>
            <h1>Dashboard</h1>
            <p class="muted" style="margin: 8px 0 0">
              Logado como <span id="adminEmail"></span>
            </p>
          </div>

          <button class="button secondary" id="logoutButton" type="button">
            Sair
          </button>
        </div>

        <p class="muted">
          Cadastre e-books aqui. Os dados serão salvos no Firestore para a
          página de produtos carregar.
        </p>
      </div>

      <div class="panel">
        <h2>Cadastrar novo e-book</h2>

        <form id="productForm">
          <div class="field">
            <label for="productTitle">Nome do e-book</label>
            <input id="productTitle" type="text" maxlength="120" required>
          </div>

          <div class="field">
            <label for="productDescription">Descrição</label>
            <textarea id="productDescription" maxlength="1000" required></textarea>
          </div>

          <div class="field">
            <label for="productPrice">Preço (R$)</label>
            <input
              id="productPrice"
              type="number"
              min="0"
              step="0.01"
              placeholder="12.00"
              required
            >
          </div>

          <div class="field">
            <label for="productImage">URL da imagem da capa</label>
            <input
              id="productImage"
              type="url"
              placeholder="https://exemplo.com/capa.jpg"
              required
            >
          </div>

          <div class="field">
            <label for="productLink">Link de compra (Kiwify)</label>
            <input
              id="productLink"
              type="url"
              placeholder="https://pay.kiwify.com.br/..."
              required
            >
          </div>

          <button class="button primary" id="saveProductButton" type="submit">
            Cadastrar e-book
          </button>

          <p id="productStatus" class="status" role="status"></p>
        </form>
      </div>

      <div class="panel">
        <h2>E-books cadastrados</h2>
        <div id="productList" class="products-list">
          <p class="muted">Carregando produtos...</p>
        </div>
        <p id="listStatus" class="status" role="status"></p>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/adm.js"></script>
</body>
</html>
